<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | NutriCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<header class="simple-nav">
    <a class="brand" th:href="@{/patient/register}"><span class="brand-icon">🥗</span><span class="brand-text">Nutri<span>Care</span></span></a>
</header>
<main class="auth-shell">
    <section class="auth-card single">
        <div class="auth-icon">🔐</div>
        <span class="eyebrow">ACCOUNT RECOVERY</span>
        <h1>Reset your password</h1>
        <p class="muted">Enter your registered email and choose a new password.</p>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label for="email">Registered Email</label>
                <input id="email" name="email" type="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">New Password</label>
                <input id="password" name="password" type="password" minlength="6" required placeholder="Minimum 6 characters">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" required placeholder="Re-enter password">
            </div>
            <button class="primary-button full" type="submit">Reset Password <span>→</span></button>
        </form>
        <p class="auth-switch"><a th:href="@{/login}">← Back to Login</a></p>
    </section>
</main>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
